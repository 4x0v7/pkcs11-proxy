# https://taskfile.dev

version: '3'

vars:
  TEST_IMAGE: pkcs11-proxy-test
  PROD_IMAGE: pkcs11-proxy

tasks:
  default: task -a

  test:
    desc: Build test image and run all tests
    cmds:
      - task: test:build
      - task: test:run

  test:build:
    desc: Build test Docker image
    cmds:
      - docker build -f docker/Dockerfile.test -t {{.TEST_IMAGE}} .

  test:run:
    desc: Run tests (image must already be built)
    cmds:
      - docker run --rm --security-opt seccomp=unconfined {{.TEST_IMAGE}}

  test:shell:
    desc: Interactive shell in test container
    cmds:
      - docker run --rm -it {{.TEST_IMAGE}} /bin/bash

  test:integration:
    desc: Run Docker Compose integration tests (multi-container)
    cmds:
      - task: test:build
      - bash docker/integration/run.sh

  dagger:test:
    desc: Run unit tests via Dagger
    cmds:
      - dagger call -m .dagger test --src=.

  dagger:integration:
    desc: Run integration tests via Dagger
    cmds:
      - dagger call -m .dagger integration-test --src=.

  dagger:sslscan:
    desc: Run sslscan TLS audit via Dagger
    cmds:
      - dagger call -m .dagger sslscan --src=.

  dagger:trivy:
    desc: Run Trivy scan via Dagger
    cmds:
      - dagger call -m .dagger trivy-scan --src=.

  lint:
    desc: Run all linters (ruff fmt + ruff check + ty)
    cmds:
      - task: lint:fmt
      - task: lint:check
      - task: lint:ty

  lint:fmt:
    desc: Format Python code with ruff
    cmds:
      - ruff format .dagger/src/pkcs_11_proxy/

  lint:check:
    desc: Lint Python code with ruff
    cmds:
      - ruff check --fix .dagger/src/pkcs_11_proxy/

  lint:ty:
    desc: Type-check Python code with ty
    dir: .dagger
    cmds:
      - ty check src/pkcs_11_proxy/

  build:
    desc: Build production server image
    cmds:
      - docker build -f docker/Dockerfile.server -t {{.PROD_IMAGE}} .
