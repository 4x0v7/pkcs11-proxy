name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install linters
        run: uv tool install ruff && uv tool install ty

      - name: ruff format --check
        run: ruff format --check .dagger/src/pkcs_11_proxy/

      - name: ruff check
        run: ruff check .dagger/src/pkcs_11_proxy/

      - name: ty check
        working-directory: .dagger
        run: ty check src/pkcs_11_proxy/

  test:
    name: Unit tests (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        uses: dagger/dagger-for-github@v8
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: test --src=.

  integration:
    name: Integration tests (Dagger)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Run integration tests
        uses: dagger/dagger-for-github@v8
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: integration-test --src=.
