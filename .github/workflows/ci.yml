name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install linters
        run: uv tool install ruff && uv tool install ty

      - name: ruff format --check
        run: ruff format --check .dagger/src/pkcs_11_proxy/

      - name: ruff check
        run: ruff check .dagger/src/pkcs_11_proxy/

      - name: ty check
        working-directory: .dagger
        run: ty check src/pkcs_11_proxy/

  test:
    name: Unit tests (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: test --src=.

  integration:
    name: Integration tests (Dagger)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Run integration tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: integration-test --src=.

  sslscan:
    name: TLS audit (sslscan)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Run sslscan
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: sslscan --src=.

  build-and-push:
    name: Build, push & sign image
    runs-on: ubuntu-latest
    needs: [integration, sslscan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
