name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install linters
        run: uv tool install ruff && uv tool install ty

      - name: ruff format --check
        run: ruff format --check .dagger/src/pkcs_11_proxy/

      - name: ruff check
        run: ruff check .dagger/src/pkcs_11_proxy/

      - name: ty check
        working-directory: .dagger
        run: ty check src/pkcs_11_proxy/

  unit-test:
    name: Unit tests (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: test --src=.

  integration:
    name: Integration tests (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run integration tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: integration-test --src=.

  sslscan:
    name: TLS audit (sslscan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run sslscan
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: sslscan --src=.

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF
    steps:
      - uses: actions/checkout@v6

      - name: Trivy scan (Dagger, fail on CRITICAL/HIGH)
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: trivy-scan --src=.

      - name: Build image for SARIF scan
        run: docker build -f docker/Dockerfile.server -t pkcs11-proxy:scan .

      - name: Run Trivy (SARIF report)
        uses: aquasecurity/trivy-action@0.34.2
        with:
          image-ref: 'pkcs11-proxy:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy (JSON report)
        uses: aquasecurity/trivy-action@0.34.2
        if: always()
        with:
          image-ref: 'pkcs11-proxy:scan'
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-vulnerability-report
          path: trivy-results.json

  build-and-push:
    name: Build, push & sign image
    runs-on: ubuntu-latest
    needs: [integration, sslscan, trivy]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
